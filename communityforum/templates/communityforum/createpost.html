{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block headtitle %}
{{act}} Post
{% endblock headtitle %}


{% block maincontent %}
<div class="container my-4">
<h1>{{act}} Post</h1>

<div class="content">
    <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{form|crispy}}
        <div>
            <a href="{% url 'communityForumHome' %}" class="btn btn-outline-secondary me-2">Cancel</a>
            <input class="btn btn-primary" type="submit" value="{{act}} Post">
        </div>
    </form>
</div>
</div>

{% endblock maincontent %}
